version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8002:8000"
    networks:
      - deploy_network
    container_name: backend
    volumes:
      - mis_datos:/app/data

  streamlit:
    build: ./streamlit
    depends_on:
      - backend
    ports:
      - "8501:8501"
    networks:
      - deploy_network
    container_name: streamlit
    volumes:
      - mis_datos:/app/data

networks:
  deploy_network:
    driver: bridge

volumes:
  mis_datos:
